server {
    # Render fournit et termine le HTTPS : nginx écoute en clair sur le port 80.
    listen 80;
    server_name _;

    # La racine web est le dossier public/ de Laravel.
    root /var/www/html/public;
    index index.php index.html index.htm;

    charset utf-8;
    sendfile off;

    # Les journaux partent vers la sortie standard, donc dans les logs Render.
    error_log /dev/stdout info;
    access_log /dev/stdout;

    # Taille maximale d'un envoi depuis l'administration (photos, vidéos).
    client_max_body_size 64M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # LE POINT ESSENTIEL : toute adresse qui ne correspond pas à un fichier
    # réel est confiée à Laravel. Sans cette ligne, seules la page d'accueil
    # et les fichiers statiques répondent ; /domaines, /contact, /admin...
    # renvoient la page « Page not Found » de nginx.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # public/storage est un lien symbolique vers storage/app/public :
    # nginx doit accepter de le suivre pour servir les images envoyées
    # depuis l'administration.
    location /storage {
        disable_symlinks off;
        try_files $uri $uri/ =404;
        access_log off;
        expires 7d;
    }

    # PHP-FPM écoute sur un socket Unix dans cette image,
    # surtout pas sur 127.0.0.1:9000 (ce qui provoque une erreur 502).
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 32k;
        fastcgi_read_timeout 300;
    }

    # On bloque l'accès aux fichiers cachés (.git, .env...),
    # sauf .well-known qui sert aux certificats.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
